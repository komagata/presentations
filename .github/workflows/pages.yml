name: Deploy presentations to Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-voice-assistant/web/**'
      - 'ai-voice-assistant/videos/OMA-PV.mp4'
      - 'ai-voice-assistant/videos/ヘイ、オーマあなたは何ですか.mp4'
      - 'omarchy-meetup3-opening/web/**'
      - 'omarchy-meetup3-opening/videos/omarchy-meetup.mp4'
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/configure-pages@v5
      - name: Test packaging
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build static site
        run: python3 tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
