<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Listen, think, and speak with Whisper, Claude, and Qwen3</title>
  <desc id="desc">Whisper listens, Claude thinks, and Qwen3 speaks. Arrows show listening flowing down to Claude and speech flowing back up.</desc>
  <rect width="1600" height="900" fill="#000000"/>
  <g fill="#91ff70">
    <rect x="200" y="170" width="480" height="240"/>
    <rect x="920" y="170" width="480" height="240"/>
    <rect x="200" y="560" width="1200" height="210"/>
    <path d="M430 410h20v96h22l-32 42-32-42h22z"/>
    <path d="M1150 560h20v-96h22l-32-42-32 42h22z"/>
  </g>
  <g fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="440" y="285" font-size="76">Listen</text>
    <text x="440" y="345" font-size="40">Whisper</text>
    <text x="1160" y="285" font-size="76">Speak</text>
    <text x="1160" y="345" font-size="40">Qwen3</text>
    <text x="800" y="665" font-size="78">Think</text>
    <text x="800" y="730" font-size="40">Claude</text>
  </g>
</svg>
