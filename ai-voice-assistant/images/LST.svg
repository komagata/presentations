<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Listen, Speak, Think</title>
  <desc id="desc">A downward Listen arrow and an upward Speak arrow sit above a wide Think box.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>

  <path d="M174 106 H464 V282 H530 L319 445 L108 282 H174 Z"
        fill="#dbeafe" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
  <text x="319" y="260" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" fill="#1e3a8a">Listen</text>

  <path d="M881 106 L1092 269 H1026 V445 H736 V269 H670 Z"
        fill="#ffedd5" stroke="#ea580c" stroke-width="7" stroke-linejoin="round"/>
  <text x="881" y="307" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" fill="#9a3412">Speak</text>

  <rect x="108" y="490" width="984" height="150" rx="24"
        fill="#e0f2f1" stroke="#0f766e" stroke-width="7"/>
  <text x="600" y="568" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#115e59">Think</text>
</svg>
